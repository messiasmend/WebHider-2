name: ⭐ WebHider — Build Atual

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout WebHider-2
        uses: actions/checkout@v4

      - name: Checkout source WebHider 2.1 validado
        uses: actions/checkout@v4
        with:
          repository: messiasmend/ProjetoH
          ref: 9863104f365c19f1ad2aec473f5fc59fdd3be12b
          path: source

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Build WebHider 2.1
        working-directory: source
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Collect dylib
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          DYLIB=$(find .theos -type f -name '*.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" ../artifacts/WebHider-2.1.dylib
          file ../artifacts/WebHider-2.1.dylib

      - name: Upload WebHider 2.1
        uses: actions/upload-artifact@v4
        with:
          name: WebHider-2.1
          path: artifacts/WebHider-2.1.dylib
          if-no-files-found: error
