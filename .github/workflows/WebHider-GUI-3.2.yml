name: WebHider — GUI 3.2

on:
  workflow_dispatch:
  push:
    branches:
      - 3.2

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout WebHider-2
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Build WebHider 3.2
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Verify package output
        run: |
          set -euo pipefail
          find .theos -maxdepth 3 -type f \( -name '*.deb' -o -name '*.dylib' \) -print

      - name: Collect dylib
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DYLIB=$(find .theos -type f -name '*.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" artifacts/WebHider-3.2.dylib
          test -s artifacts/WebHider-3.2.dylib

      - name: Upload WebHider 3.2
        uses: actions/upload-artifact@v4
        with:
          name: WebHider-3.2
          path: artifacts/WebHider-3.2.dylib
          if-no-files-found: error
